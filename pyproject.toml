[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptruestorage"
version = "0.1.0"
description = "Verificación de legitimidad, velocidad y autenticidad de dispositivos de almacenamiento (HDD, NVMe SSD, MicroSD)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llsfo" }]

[project.scripts]
aptrue = "aptrue.cli:main"

[tool.pyinstaller]
name = "aptrue"

[tool.setuptools]
packages = ["aptrue"]
