name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: aptrue-windows
            ext: .exe
          - os: ubuntu-latest
            artifact: aptrue-linux
            ext: ""
          - os: macos-latest
            artifact: aptrue-macos
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyinstaller .
        shell: bash

      - name: Bundle smartmontools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL -o smartmontools.zip https://sourceforge.net/projects/smartmontools/files/smartmontools/7.5/smartmontools-7.5-1.win.zip/download
          unzip -q smartmontools.zip
          find . -name "smartctl*" -type f
          mkdir -p bundle
          cp smartmontools-*/bin/smartctl.exe bundle/ || find . -name smartctl.exe -exec cp {} bundle/ \;
          ls -la bundle/

      - name: Bundle smartmontools (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p bundle
          if command -v smartctl >/dev/null; then
            cp "$(command -v smartctl)" bundle/
          else
            if [ "$RUNNER_OS" = "macOS" ]; then brew install smartmontools; else sudo apt-get update -qq && sudo apt-get install -y -qq smartmontools; fi
            cp "$(command -v smartctl)" bundle/
          fi
          ls -la bundle/

      - name: Build executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            pyinstaller --onefile --name aptrue --add-data "bundle;." aptrue/cli.py
          else
            pyinstaller --onefile --name aptrue --add-data "bundle:." aptrue/cli.py
          fi

      - name: Rename with platform
        shell: bash
        run: |
          mv dist/aptrue${{ matrix.ext }} dist/aptrue-${{ runner.os }}${{ matrix.ext }}

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/aptrue-Windows.exe --version
            ./dist/aptrue-Windows.exe list || true
          else
            chmod +x dist/aptrue-${{ runner.os }}
            ./dist/aptrue-${{ runner.os }} --version
            ./dist/aptrue-${{ runner.os }} list || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
